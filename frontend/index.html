<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#58CC02">
  <title>Networking Buddy</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app">
    <!-- Each screen module fills its own section. Don't put markup inside them. -->
    <section id="screen-home" hidden></section>      <!-- home.js -->
    <section id="screen-contacts" hidden></section>  <!-- contacts.js -->
    <section id="screen-game" hidden></section>      <!-- game.js: chat, then score -->
    <section id="screen-task" hidden></section>      <!-- tasks.js: reflection, then success -->
  </main>

  <nav class="tabbar">
    <a href="#/home" data-nav="home"><span>🏠</span>Home</a>
    <a href="#/contacts" data-nav="contacts"><span>👥</span>Contacts</a>
  </nav>

  <!-- app.js is the shared core; each screen module registers itself with its router. -->
  <script type="module" src="/app.js"></script>
  <script type="module" src="/home.js"></script>
  <script type="module" src="/contacts.js"></script>
  <script type="module" src="/game.js"></script>
  <script type="module" src="/tasks.js"></script>
</body>
</html>
