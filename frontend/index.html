<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nudge">
  <meta name="application-name" content="Nudge">
  <meta name="theme-color" content="#58CC02">
  <title>Nudge</title>
  <link rel="manifest" href="/manifest_C.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <!-- iOS needs a PNG with no transparency; it rounds the corners itself. -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles_b.css">
  <link rel="stylesheet" href="/styles_C.css">
</head>
<body>
  <main id="app">
    <!-- Each screen fills its own section from JS. Don't put markup inside them. -->
    <section id="screen-home" hidden></section>      <!-- home_b.js     (B) -->
    <section id="screen-contacts" hidden></section>  <!-- contacts_b.js (B) -->
    <section id="screen-radar" hidden></section>     <!-- radar.js -->
    <section id="screen-notifications" hidden></section>
    <section id="screen-game" hidden></section>      <!-- game_C.js     (C) -->
    <section id="screen-task" hidden></section>      <!-- tasks_C.js    (C) -->
  </main>

  <nav class="tabbar">
    <a href="#/home" data-nav="home"><span>🏠</span>Home</a>
    <a href="#/contacts" data-nav="contacts"><span>👥</span>Contacts</a>
    <a href="#/radar" data-nav="radar"><span>📡</span>Radar</a>
    <a href="#/notifications" data-nav="notifications"><span>🔔</span>Notifications</a>
  </nav>

  <!-- One script per screen. If one is missing or broken, the others still load. -->
  <script type="module" src="/app_b.js"></script>
  <script type="module" src="/home_b.js"></script>
  <script type="module" src="/contacts_b.js"></script>
  <script type="module" src="/radar.js"></script>
  <script type="module" src="/notifications.js"></script>
  <script type="module" src="/game_C.js"></script>
  <script type="module" src="/tasks_C.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
  </script>
</body>
</html>
